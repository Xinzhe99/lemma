id: w3-polish
name: 学术润色
description: 按目标（清晰度/简洁/正式度/期刊风格）润色选段，产出 diff 并在用户检查点确认后应用。
inputs:
  - selection
  - target
  - styleNotes
steps:
  - id: analyze
    name: 分析原文与目标差距
    prompt: |
      你将润色以下学术文本。润色目标：{{target}}。
      待润色文本：
      {{selection}}

      请执行：
      1. 调用 project.context 获取风格档案（sections 取 manuscript 与 style）。
      2. 对照目标与风格档案，逐句列出问题清单：模糊表述、冗余、时态不一致、hedging 过重或不足、术语不统一等。
      3. 标注哪些问题源于风格档案的硬约束（必须改）、哪些是建议（可改可不改）。
      作者风格备注：{{styleNotes}}

      输出：问题清单（每条附原文定位与理由）。
    allowedTools:
      - project.context
    modelTier: cheap

  - id: rewrite
    name: 生成润色 diff
    prompt: |
      基于上一步的问题清单，对文本做最小必要修改，产出 unified diff。

      约束：
      1. 只改必须改的问题，建议项仅在完全不损害原意时一并处理。
      2. 保留作者风格：句长分布、时态习惯、hedging 程度与风格档案一致。
      3. 数学环境、\cite 键、参考文献条目一律不动。
      4. 输出标准 unified diff（--- a/… +++ b/… 格式），并在 diff 后附每处修改的一句话理由。
      润色目标：{{target}}；作者风格备注：{{styleNotes}}。
    dependsOn:
      - analyze
    modelTier: flagship

  - id: apply
    name: 应用润色修改
    prompt: |
      用户已在检查点确认润色 diff（确认输入见 checkpointInput）。
      请执行：
      1. 调用 snapshot.create，标签为「润色前快照」。
      2. 调用 tex.edit 应用上一步的 diff（携带用户确认中的取舍说明）。
      3. 调用 tex.compile 验证修改后全文可编译；失败则调用 tex.last_errors 报告。
      4. 输出：已应用的修改摘要 + 编译验证结果；若用户在确认输入中否决了部分修改，说明跳过项。
    dependsOn:
      - rewrite
    checkpoint: true
    allowedTools:
      - snapshot.create
      - tex.edit
      - tex.compile
      - tex.last_errors
    modelTier: cheap
