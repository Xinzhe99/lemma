id: w16-promo
name: 发表后宣传物料
description: 论文接收后一键生成宣传物料：X/推特帖、中文社交帖（小红书/知乎风）、graphical abstract 构思、院系新闻稿。
inputs:
  - paperTitle
  - venue
steps:
  - id: draft
    name: 起草四种物料
    prompt: |
      论文已被接收：{{paperTitle}}（{{venue}}）。请通读稿件后生成四种宣传物料，作为发表后的宣传包：
      硬性前提：所有数字、方法名、样本量、指标提升幅度一律取自稿件原文，禁止编造或外推；稿件中没有的信息用【待作者补充：…】占位。
      一、英文 X 帖（独立小节）：不超过 280 字符（含空格与标签），恰好 3 个 # 标签——1 个领域标签、1 个方法标签、1 个 {{venue}} 相关标签；结构建议：一句话核心贡献 → 为什么值得关注 → 论文链接占位；小节末附字符计数。
      二、中文社交帖（小红书/知乎风，独立小节）：150–250 字，通俗但有信息量——用平实语言讲清「解决了什么问题、怎么做的、效果如何」，可适度口语化与分段，但不得使用夸张标题党措辞；小节末附字数。
      三、graphical abstract 构思（独立小节）：一张图讲清论文——分别描述（1）要素：图中应出现的 3–5 个关键元素（如输入数据、方法模块、输出指标）及其标注文字；（2）布局：各元素的位置与箭头流向（左→右 / 上→下）；（3）配色：主色/强调色建议与语义（如方法用蓝、结果用绿）；写给设计师或绘图 AI 可直接落地的文字说明，不要求生成图片本身。
      四、院系新闻稿段落（独立小节）：200–300 字，中规中矩的机构通稿语气——交代作者与单位（未知则占位）、研究问题、方法要点、发表 venue 与意义，不使用第一人称，不夸大影响；小节末附字数。
      输出：markdown，四种物料各用一个二级标题独立成节（顺序：X 帖 → 中文社交帖 → graphical abstract → 新闻稿），节内为成品文案或构思说明。
    allowedTools:
      - project.context
    modelTier: flagship

  - id: confirm
    name: 自查与确认
    prompt: |
      请自查语气事实性与各平台字数，并列出确认项后停在检查点等待作者确认：
      1. 语气事实性：逐份检查四种物料——有无夸大 claim 的措辞（如「首次」「突破性」「远超一切」除非稿件原文有据）、有无稿件中不存在的数字或结论、X 帖与新闻稿的表述是否与稿件结论一致；发现的问题逐条列出并给出改后文案。
      2. 字数核对：英文 X 帖是否不超过 280 字符且恰好 3 个标签；中文社交帖是否在 150–250 字；新闻稿段落是否在 200–300 字；超限或不足时先改再复述计数。
      3. 一致性核对：{{venue}} 名称、论文题名（{{paperTitle}}）在各物料中拼写一致；【待作者补充：…】占位项单独汇总提醒。
      输出：确认项清单（每项标注「通过 / 已修正 / 待作者补充」），然后停在检查点（确认输入中写明采纳或修改意见，如「X 帖第二句改短；社交帖换个开头；其余照发」）。
    dependsOn:
      - draft
    checkpoint: true
    modelTier: cheap
