name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 前端主线：类型检查 → 单测 → 构建（Node 20 + npm 缓存）
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Rust 壳检查：仅当 apps/desktop/src-tauri/** 或本 workflow 有变更时执行 cargo check
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect src-tauri changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tauri:
              - 'apps/desktop/src-tauri/**'
              - '.github/workflows/ci.yml'
      # Tauri v2 在 Linux 的系统依赖（gobject/gtk/webkit2gtk 等，runner 不预装）
      - name: Install Tauri Linux system deps
        if: steps.filter.outputs.tauri == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.tauri == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.tauri == 'true'
        with:
          workspaces: apps/desktop/src-tauri
      - name: Cargo check
        if: steps.filter.outputs.tauri == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo check
