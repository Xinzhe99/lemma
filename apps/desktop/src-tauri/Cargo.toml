[package]
name = "lemma"
version = "7.5.0"
description = "Lemma — AI-native end-to-end scholarly writing workstation"
edition = "2021"

[lib]
name = "lemma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 内置 TeX 引擎（Tectonic）自动下载：ureq 轻量阻塞 HTTP(S)（rustls TLS），
# zip/tar+flate2 解包 GitHub Releases 发行包（Windows zip / macOS·Linux tar.gz）。
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
