[package]
name = "scholarforge"
version = "0.6.0"
description = "ScholarForge — AI-native end-to-end scholarly writing workstation"
edition = "2021"

[lib]
name = "scholarforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
